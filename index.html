<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>License Activation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOADING VIDEO -->
  <div id="loading-screen">
    <video
      id="loading-video"
      autoplay
      muted
      playsinline
      preload="auto"
    >
      <source src="./loadingscreen.mp4" type="video/mp4">
      Your browser does not support MP4 video.
    </video>
  </div>

  <!-- MAIN WEBSITE -->
  <main class="page">
    <section class="card">
      <h1>License Activation</h1>

      <p class="description">
        Enter your license key to activate this device.
      </p>

      <input
        id="key"
        type="text"
        placeholder="LIC-XXXXXX-XXXXXX-XXXXXX"
        autocomplete="off"
        spellcheck="false"
      >

      <button id="activate">Activate</button>

      <p id="result"></p>
    </section>
  </main>

  <script>
    // Change this to your deployed backend URL.
    const API_URL = "https://YOUR-BACKEND.example.com";

    const loadingScreen =
      document.getElementById("loading-screen");

    const loadingVideo =
      document.getElementById("loading-video");

    function hideLoadingScreen() {
      if (!loadingScreen) return;

      loadingScreen.classList.add("hidden");

      setTimeout(() => {
        loadingScreen.remove();
      }, 600);
    }

    loadingVideo.addEventListener(
      "ended",
      hideLoadingScreen
    );

    loadingVideo.addEventListener(
      "error",
      hideLoadingScreen
    );

    // Safety fallback so a broken video cannot block the site.
    setTimeout(() => {
      if (document.getElementById("loading-screen")) {
        hideLoadingScreen();
      }
    }, 15000);

    function getDeviceId() {
      let id = localStorage.getItem("license_device_id");

      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem("license_device_id", id);
      }

      return id;
    }

    document
      .getElementById("activate")
      .addEventListener("click", async () => {

        const key =
          document.getElementById("key").value.trim();

        const result =
          document.getElementById("result");

        const button =
          document.getElementById("activate");

        if (!key) {
          result.textContent =
            "Please enter a license key.";
          return;
        }

        button.disabled = true;
        result.textContent = "Checking license...";

        try {
          const response = await fetch(
            API_URL + "/api/activate",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                key,
                deviceId: getDeviceId()
              })
            }
          );

          const data = await response.json();

          if (response.ok) {
            result.textContent =
              "✓ License activated successfully!";
          } else {
            result.textContent =
              data.error || "Activation failed.";
          }

        } catch (error) {
          result.textContent =
            "Unable to connect to the license server.";
        }

        button.disabled = false;
      });
  </script>

</body>
</html>
